[package]
name = "grepdef"
version = "3.5.0"
edition = "2021"
repository = "https://github.com/sirbrillig/grepdef"
homepage = "https://github.com/sirbrillig/grepdef"
description = "Quick search for symbol definitions in various programming languages"
license-file = "LICENSE"
documentation = "https://docs.rs/grepdef/latest/grepdef"

[dependencies]
clap = { version = "4.5.9", features = ["derive"] }
colored = "2.1.0"
crossbeam-channel = "0.5.15"
exitcode = "1.1.2"
ignore = "0.4.22"
memchr = "2.7.4"
regex = "1.10.5"
rstest = "0.21.0"
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
strum = "0.26.3"
strum_macros = "0.26.4"

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
